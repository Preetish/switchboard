# Sample rule set for Switchboard.
#
# Rules apply top to bottom; the first match wins. If nothing matches, the
# `fallback` route fires. `crm.*` conditions are resolved from HubSpot before
# evaluation; `form.*` keys come straight from the submission.
#
# Bare scalars are `eq` shorthand, and the bare word `exists` means
# `{ exists: true }`.

rules:
  - name: Existing owner wins
    when:
      crm.contact.owner: exists
    route:
      to: crm.contact.owner

  # A one-person company has nobody to route to: skip the sales call and
  # say so, in so many words, on the self-serve page.
  - name: Solo company goes self-serve
    when:
      form.company_size: { lte: 1 }
    route:
      action: self_serve_link
      message: "With a team of one, there is nobody to route you to yet, so a sales call would only slow you down. You can set everything up yourself in a few minutes, and support is there if you get stuck."

  - name: DACH region
    when:
      form.country: { in: [DE, AT, CH] }
    route:
      team: dach
      strategy: round_robin

  # Any team bigger than one person gets a rep and a calendar.
  - name: Teams get a rep
    when:
      form.company_size: { gt: 1 }
    route:
      team: enterprise
      strategy: round_robin

  # Reached only when company size is missing (e.g. API submissions).
  - name: Personal email goes self-serve
    when:
      form.email_domain: { in: [gmail.com, outlook.com, yahoo.com] }
    route:
      action: self_serve_link

fallback:
  team: default
  strategy: round_robin
