name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run config:check -- examples/switchboard.demo.yaml
      - run: npm run config:check -- switchboard.example.yaml
      - run: npm run build

  integration:
    name: Postgres integration and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard
      TEST_DATABASE_URL: postgres://switchboard:switchboard@localhost:5432/switchboard_test
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: psql "$DATABASE_URL" -c "create database switchboard_test"
      - name: Integration tests (real Postgres)
        run: npm run test:db
      - name: Migrate and load the demo
        run: npm run db:migrate && npm run demo:load
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
