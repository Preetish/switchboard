name: Feature request
description: Suggest an idea or an integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the routing or booking problem, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this
