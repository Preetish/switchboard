# One-command setup: `docker compose up` starts Postgres, applies migrations,
# loads your config (./config/switchboard.yaml) or the demo, and serves the
# app on http://localhost:3000.
#
# Secrets you leave unset (AUTH_SECRET, TOKEN_ENCRYPTION_KEY, ADMIN_PASSWORD)
# are generated on first start and kept in the `appdata` volume; the admin
# password is printed once in the logs. Put your own values in .env (see
# .env.example) to manage them yourself.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchboard}
      POSTGRES_DB: switchboard
    # Not published: only the app container can reach Postgres. To connect
    # from your machine, uncomment (localhost only — never 0.0.0.0):
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard -d switchboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Uses the published image when available, otherwise builds this checkout.
    image: ghcr.io/preetish/switchboard:${SWITCHBOARD_VERSION:-latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - appdata:/var/lib/switchboard
      # Your setup: put switchboard.yaml (and any rule files) in ./config.
      - ./config:/app/config:ro
    environment:
      DATABASE_URL: postgres://switchboard:${POSTGRES_PASSWORD:-switchboard}@db:5432/switchboard
      # Demo form, reps, and rules at /f/book-a-demo — used only when there is
      # no ./config/switchboard.yaml.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      ORG_SLUG: ${ORG_SLUG:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FALLBACK_BOOKING_URL: ${FALLBACK_BOOKING_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SPEED_TO_LEAD_MINUTES: ${SPEED_TO_LEAD_MINUTES:-5}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

volumes:
  pgdata:
  appdata:
